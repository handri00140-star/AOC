<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Sistem Penilaian 5R</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f0f2f5;--sidebar:#0f172a;--sidebar-hover:#1e293b;--primary:#059669;--primary-dark:#047857;--accent:#f59e0b;--danger:#ef4444;--card:#fff;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
#login-screen{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#064e3b 100%)}
.login-box{background:var(--card);border-radius:16px;padding:36px 32px;width:92%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.login-logo-icon{width:48px;height:48px;background:linear-gradient(135deg,#059669,#10b981);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;flex-shrink:0}
.login-logo-text{font-weight:800;font-size:17px;line-height:1.3;color:var(--text)}.login-logo-text span{color:#059669}
.login-error{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:12px;display:none;align-items:center;gap:6px}.login-error.show{display:flex}
.sidebar{width:260px;min-width:260px;background:var(--sidebar);color:#e2e8f0;display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;z-index:50}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.sidebar .logo{padding:16px 14px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px}
.sidebar .logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#059669,#10b981);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;flex-shrink:0}
.sidebar .logo-text{font-weight:800;font-size:13px;line-height:1.3}.sidebar .logo-text span{color:#10b981}
.menu-group{padding:8px 0}.menu-group-label{padding:5px 16px;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#475569;font-weight:700}
.menu-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:all .15s;font-size:12.5px;font-weight:500;border-left:3px solid transparent;color:#94a3b8;user-select:none}
.menu-item:hover{background:var(--sidebar-hover);color:#e2e8f0}.menu-item.active{background:rgba(5,150,105,.13);color:#10b981;border-left-color:#10b981}
.menu-item i{width:17px;text-align:center;font-size:13px}
.sidebar-user{margin-top:auto;padding:12px 14px;border-top:1px solid #1e293b;display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.sidebar-userinfo{flex:1;min-width:0}.sidebar-userinfo .name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-userinfo .role{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
.topbar .page-title{font-weight:700;font-size:16px}
.topbar .date-display{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.content{flex:1;overflow-y:auto;padding:20px}.content::-webkit-scrollbar{width:5px}.content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
.card{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:16px;margin-bottom:12px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.stat-card{background:var(--card);border-radius:11px;border:1px solid var(--border);padding:14px;display:flex;align-items:center;gap:12px;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.07)}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.stat-value{font-size:20px;font-weight:800;line-height:1}.stat-label{font-size:10px;color:var(--text-muted);margin-top:2px}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--text-muted);padding:8px 10px;text-align:left;border-bottom:2px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}tr:hover td{background:#f8fafc}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-warning{background:var(--accent);color:#fff}.btn-warning:hover{background:#d97706}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:#f8fafc}
.btn-sm{padding:4px 8px;font-size:10.5px}
.btn-ghost{background:transparent;border:none;color:var(--text-muted);padding:4px 7px;cursor:pointer;border-radius:5px}.btn-ghost:hover{color:var(--danger);background:#fee2e2}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.badge-lomba{background:#dbeafe;color:#1d4ed8}.badge-nonlomba{background:#fef3c7;color:#92400e}
.badge-ok{background:#d1fae5;color:#065f46}.badge-tidak{background:#fee2e2;color:#991b1b}.badge-skip{background:#f1f5f9;color:#475569}
.badge-admin{background:#fee2e2;color:#991b1b}.badge-pengawas{background:#dbeafe;color:#1d4ed8}.badge-spv{background:#fef3c7;color:#92400e}.badge-pelaksana{background:#d1fae5;color:#065f46}
.form-group{margin-bottom:11px}.form-label{display:block;font-size:10px;font-weight:600;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-select,.form-textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;transition:border-color .15s;background:#fff;color:var(--text)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.form-textarea{resize:vertical;min-height:55px}
.radio-btn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;transition:all .12s;user-select:none;display:inline-flex;align-items:center;gap:4px}
.radio-btn.sel-ok{background:#d1fae5;border-color:#059669;color:#065f46}
.radio-btn.sel-tidak{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.radio-btn.sel-skip{background:#f1f5f9;border-color:#94a3b8;color:#475569}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-box{background:var(--card);border-radius:13px;width:92%;max-width:500px;max-height:85vh;overflow-y:auto;transform:translateY(14px) scale(.97);transition:transform .2s}
.modal-overlay.show .modal-box{transform:translateY(0) scale(1)}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-weight:700;font-size:14px}
.modal-close{width:28px;height:28px;border-radius:6px;border:none;background:#f1f5f9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);transition:all .15s}
.modal-close:hover{background:#fee2e2;color:var(--danger)}
.modal-body{padding:18px}.modal-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px}
.toast-container{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:10px 14px;border-radius:8px;font-size:11.5px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;animation:toastIn .3s ease;box-shadow:0 6px 24px rgba(0,0,0,.15);min-width:240px;pointer-events:auto}
.toast-success{background:#059669}.toast-error{background:#ef4444}.toast-info{background:#3b82f6}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(30px)}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:14px 0 0}
.podium-item{display:flex;flex-direction:column;align-items:center;border-radius:10px 10px 0 0;overflow:hidden}
.podium-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 20px;color:#fff;font-weight:800;font-size:18px;min-width:100px}
.podium-label{font-size:10px;font-weight:600;padding:6px 12px;background:#f8fafc;color:var(--text);width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium-1 .podium-bar{background:linear-gradient(135deg,#f59e0b,#fbbf24);height:120px}
.podium-2 .podium-bar{background:linear-gradient(135deg,#94a3b8,#cbd5e1);height:95px;color:#334155}
.podium-3 .podium-bar{background:linear-gradient(135deg,#b45309,#d97706);height:70px}
.empty-state{text-align:center;padding:30px 14px;color:var(--text-muted)}.empty-state i{font-size:32px;margin-bottom:8px;opacity:.3;display:block}.empty-state p{font-size:12px}
.progress-bar{height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden}.progress-fill{height:100%;border-radius:4px;transition:width .5s ease}
.tab-group{display:flex;gap:3px;background:#f1f5f9;padding:3px;border-radius:7px}
.tab-item{padding:5px 12px;border-radius:5px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text-muted);user-select:none}
.tab-item.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.info-box{border-radius:7px;padding:9px 12px;font-size:11px;margin-bottom:12px;display:flex;align-items:start;gap:7px}
.info-box i{margin-top:2px;flex-shrink:0}
.info-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.info-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#065f46}
.chk-grid{display:grid;grid-template-columns:1fr 85px 85px 130px;gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:12px}
.chk-head{padding:7px 10px;background:#f8fafc;font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--text-muted);border-bottom:2px solid var(--border);text-align:center}
.chk-head:first-child{text-align:left}
.chk-cat{grid-column:1/-1;background:#f0fdf4;padding:4px 10px;font-weight:700;font-size:10px;color:#065f46;border-bottom:1px solid #bbf7d0}
.chk-desc{padding:7px 10px;border-bottom:1px solid var(--border);font-size:11.5px}
.chk-cell{padding:7px 10px;border-bottom:1px solid var(--border);display:flex;gap:3px;justify-content:center;align-items:center}
.seed-banner{background:linear-gradient(135deg,#065f46,#059669);color:#fff;border-radius:9px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.seed-banner p{font-size:12px;font-weight:500}
.no-access{text-align:center;padding:40px;color:var(--text-muted)}.no-access i{font-size:40px;display:block;margin-bottom:10px;opacity:.3}
.area-chk-list{max-height:150px;overflow-y:auto;border:1px solid var(--border);padding:8px;border-radius:7px;background:#f8fafc}
.area-chk-list label{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px;cursor:pointer}
@media(max-width:768px){.sidebar{position:fixed;left:-260px;transition:left .3s}.sidebar.open{left:0}.chk-grid{grid-template-columns:1fr}.chk-cell{flex-direction:column;gap:2px}.chk-head:not(:first-child),.chk-cell{display:none}}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo"><div class="login-logo-icon">5R</div><div class="login-logo-text">ERP Penilaian<br><span>Program 5R</span></div></div>
    <div class="login-error" id="login-error"><i class="fas fa-circle-xmark"></i><span id="login-err-msg"></span></div>
    <div class="form-group"><label class="form-label">Username</label><input class="form-input" id="login-user" placeholder="Masukkan username" autocomplete="off"></div>
    <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="login-pass" placeholder="Masukkan password"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;font-size:13px;margin-top:4px" onclick="doLogin()"><i class="fas fa-right-to-bracket"></i>Masuk</button>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);text-align:center">
      <div style="font-size:10px;color:var(--text-muted);margin-bottom:8px">Pertama kali? Muat data contoh dulu:</div>
      <button class="btn btn-outline" style="width:100%;justify-content:center" onclick="seedFromLogin()"><i class="fas fa-flask"></i>Muat Data Contoh</button>
    </div>
  </div>
</div>
<div id="app" style="display:flex;height:100vh">
<aside class="sidebar" id="sidebar">
  <div class="logo"><div class="logo-icon">5R</div><div class="logo-text">ERP Penilaian<br><span>Program 5R</span></div></div>
  <div id="menu-container"></div>
  <div class="sidebar-user" id="sidebar-user"></div>
</aside>
<div class="main-wrap">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-ghost" id="btn-menu" style="display:none;font-size:17px" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
      <div class="page-title" id="page-title">Dashboard</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="date-display"><i class="fas fa-calendar-days"></i><span id="top-date"></span></div>
      <button class="btn btn-outline btn-sm" onclick="doLogout()" title="Keluar"><i class="fas fa-right-from-bracket"></i></button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
</div>
<div class="modal-overlay" id="modal"><div class="modal-box"><div class="modal-header"><h3 id="modal-title"></h3><button class="modal-close" onclick="hideModal()"><i class="fas fa-xmark"></i></button></div><div class="modal-body" id="modal-body"></div><div class="modal-footer" id="modal-footer"></div></div></div>
<div class="toast-container" id="toast-box"></div>
<script>
var DB={get:function(k){try{return JSON.parse(localStorage.getItem('erp5r_'+k)||'[]')}catch(e){return[]}},set:function(k,v){localStorage.setItem('erp5r_'+k,JSON.stringify(v))},uid:function(){return 'u'+Date.now().toString(36)+Math.random().toString(36).substr(2,5)}};
var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var CAT5R=['Ringkas','Rapi','Resik','Rawat','Rajin'];
var ROLES={admin:'Admin',pengawas:'Pengawas',spv:'SPV',pelaksana:'Pelaksana'};
var ROLE_COLORS={admin:'badge-admin',pengawas:'badge-pengawas',spv:'badge-spv',pelaksana:'badge-pelaksana'};
function fmtD(s){if(!s)return'-';var d=new Date(s);return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function allDates(y,m){var n=daysInMonth(y,m),a=[];for(var i=1;i<=n;i++)a.push(y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0'));return a}
function weekStart(ds){var d=new Date(ds);var day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weeksInMonth(y,m){var dates=allDates(y,m),seen={},w=[];dates.forEach(function(d){var ws=weekStart(d);if(!seen[ws]){seen[ws]=1;w.push(ws)}});return w}
function mPrefix(y,m){return y+'-'+String(m+1).padStart(2,'0')}
var CU=null;
function getSession(){try{var s=sessionStorage.getItem('erp5r_session');return s?JSON.parse(s):null}catch(e){return null}}
function setSession(u){sessionStorage.setItem('erp5r_session',JSON.stringify(u))}
function clearSession(){sessionStorage.removeItem('erp5r_session')}
function toast(msg,type){type=type||'success';var c=document.getElementById('toast-box');var el=document.createElement('div');el.className='toast toast-'+type;el.innerHTML='<i class="fas '+(type==='success'?'fa-circle-check':type==='error'?'fa-circle-xmark':'fa-circle-info')+'"></i><span>'+msg+'</span>';c.appendChild(el);setTimeout(function(){el.style.animation='toastOut .3s ease forwards';setTimeout(function(){el.remove()},300)},3000)}
function showModal(title,body,footer){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-footer').innerHTML=footer||'';document.getElementById('modal').classList.add('show')}
function hideModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)hideModal()});
function logAct(desc){var a=DB.get('activities');a.push({id:DB.uid(),desc:desc,date:todayStr(),ts:Date.now()});if(a.length>80)a.splice(0,a.length-80);DB.set('activities',a)}
function ensureAdmin(){var users=DB.get('users');var found=false;for(var i=0;i<users.length;i++){if(users[i].username==='admin'){found=true;break;}}if(!found){users.push({id:'admin_default',name:'Administrator',username:'admin',password:'admin123',dept:'GM',role:'admin',areas:[],ts:Date.now()});DB.set('users',users);}}
ensureAdmin();

function seedFromLogin(){
  if(DB.get('areas').length>0){doLoginDirect('admin','admin123');return;}
  var areas=[
    {id:'a1',name:'Produksi Line A',type:'lomba',dept:'Produksi',ts:1},
    {id:'a2',name:'Produksi Line B',type:'lomba',dept:'Produksi',ts:1},
    {id:'a3',name:'Produksi Line C',type:'lomba',dept:'Produksi',ts:1},
    {id:'a4',name:'Warehouse',type:'lomba',dept:'Warehouse',ts:1},
    {id:'a5',name:'Gudang Bahan Baku',type:'non-lomba',dept:'Warehouse',ts:1},
    {id:'a6',name:'Kantor Administrasi',type:'non-lomba',dept:'Administrasi',ts:1},
    {id:'a7',name:'Area Parkir',type:'non-lomba',dept:'Umum',ts:1}
  ];
  DB.set('areas',areas);
  var cls=[];var descMap={Ringkas:['Tidak ada barang yang tidak digunakan di area kerja','Tidak ada material sisa yang menumpuk','Area bebas dari barang pribadi berlebih','Tidak ada pallet rusak berserakan','Bahan kadaluwarsa sudah disortir','Meja kerja bebas dari dokumen tidak terpakai','Area parkir bebas dari barang tidak terpakai'],Rapi:['Alat kerja tersusun rapi di tempatnya','Toolbox tertata sesuai peta 5S','Kabel dan selang tersusun rapi','Barang disusun sesuai lokasi rak','Stocker tersusun FIFO','Filing cabinet tertata rapi','Kendaraan terparkir sesuai marking'],Resik:['Lantai bersih dan tidak ada tumpahan','Meja kerja bersih dari debu dan kotoran','Mesin dan peralatan terawat kebersihannya','Lorong gudang bebas sampah','Area penyimpanan bersih','Ruang kerja bersih dan rapi','Area parkir bersih dari sampah'],Rawat:['Penanda area masih jelas terbaca','Label pada setiap rak masih terpasang','Floor marking terlihat jelas','Papan penunjuk arah dalam kondisi baik','Label identifikasi bahan lengkap','Prosedur 5R terpajang di dinding','Marking garis parkir terlihat jelas'],Rajin:['Seluruh anggota mematuhi SOP 5R','Briefing 5R dilaksanakan setiap shift','Checksheet 5R diisi tepat waktu','Audit internal 5R terjadwal','Petugas menjalankan prinsip 5R','Karyawan rajin menerapkan 5R','Petugas keamanan memantau kebersihan']};
  var aIds=['a1','a2','a3','a4','a5','a6','a7'];

function calcScore(areaId,y,m){var area=DB.get('areas').find(function(a){return a.id===areaId});if(!area)return null;var cls=DB.get('checklists').filter(function(c){return c.areaId===areaId});var n=cls.length;if(n===0)return{base:0,initB:0,mysP:0,kantB:0,kantP:0,final:0,area:area};var ppi=100/n;var pen=DB.get('penilaian').filter(function(p){return p.areaId===areaId&&p.date.substring(0,7)===mPrefix(y,m)});var dates=allDates(y,m);var daily=[];dates.forEach(function(date){var shifts=[];['pagi','siang'].forEach(function(shift){var rec=pen.find(function(p){return p.date===date&&p.shift===shift});if(rec&&rec.items){var t=0;cls.forEach(function(cl){var it=rec.items.find(function(i){return i.clId===cl.id});if(it&&it.picOk&&it.spvOk&&(it.pwSt==='ok'||it.pwSt==='skip'))t+=ppi;});shifts.push(t);}});if(shifts.length>0)daily.push(shifts.reduce(function(a,b){return a+b},0)/shifts.length);});var base=daily.length>0?daily.reduce(function(a,b){return a+b},0)/daily.length:0;var pf=mPrefix(y,m);var initB=DB.get('inisiatif').filter(function(i){return i.areaId===areaId&&i.date.substring(0,7)===pf}).length*25;var mysP=DB.get('mystery').filter(function(x){return x.areaId===areaId&&x.date.substring(0,7)===pf}).length*25;var kantB=0,kantP=0;DB.get('pk_result').forEach(function(r){if(r.date.substring(0,7)!==pf)return;if(r.areaId===areaId&&r.clean&&r.verified)kantB+=100;if(!r.clean&&r.verified){var duty=getDuty(r.date,r.shift);if(duty&&duty!==areaId)kantP+=50;}});var fin=base+initB-mysP+kantB-kantP;if(area.type==='non-lomba'&&fin>100)fin=100;return{base:Math.round(base*100)/100,initB:initB,mysP:mysP,kantB:kantB,kantP:kantP,final:Math.round(fin*100)/100,area:area};}

function saveUser(id){
  var name=document.getElementById('f-un').value.trim();
  var username=document.getElementById('f-uun').value.trim().toLowerCase();
  var pass=document.getElementById('f-upw').value;
  var dept=document.getElementById('f-ud').value.trim();
  var role=document.getElementById('f-ur').value;
  if(!name||!dept){toast('Nama dan departemen wajib','error');return;}
  
  // AMBIL DATA AREA YANG DICENTANG
  var selectedAreas = [];
  if(role==='spv' || role==='pelaksana'){
    document.querySelectorAll('.area-chk:checked').forEach(function(el){ selectedAreas.push(el.value); });
    if(selectedAreas.length===0){toast('Pilih minimal 1 area untuk role ini','error');return;}
  }

  var list=DB.get('users');
  if(id){
    var i=list.findIndex(function(x){return x.id===id});
    if(i>=0){
      list[i].name=name;list[i].dept=dept;list[i].role=role;list[i].areas=selectedAreas;
      if(pass)list[i].password=pass;
    }
  }else{
    if(!username||!pass){toast('Username dan password wajib','error');return;}
    var dup=list.find(function(x){return x.username.toLowerCase()===username});
    if(dup){toast('Username sudah ada','error');return;}
    list.push({id:DB.uid(),name:name,username:username,password:pass,dept:dept,role:role,areas:selectedAreas,ts:Date.now()});
  }
  DB.set('users',list);hideModal();toast(id?'Diperbarui':'Ditambahkan');logAct((id?'Edit':'Tambah')+' user: '+name+' ('+ROLES[role]+')');pgMasterUser();
}

><thead><tr><th style="width:40px;text-align:center">Tgl</th><th>Pagi</th><th>Sore</th></tr></thead><tbody>';for(var d=1;d<=n;d++){var ds=_pkY+'-'+String(_pkM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var p=sched.find(function(s){return s.date===ds&&s.shift==='pagi'});var sr=sched.find(function(x){return x.date===ds&&x.shift==='sore'});h+='<tr><td style="font-weight:600;text-align:center">'+d+'</td><td><select class="form-select" style="padding:3px 6px;font-size:10px" onchange="savePKEv(\''+ds+'\',\'pagi\',this.value)"><option value="">--</option>'+areas.map(function(a){return'<option value="'+a.id+'"'+(p&&p.areaId===a.id?' selected':'')+'>'+a.name+'</option>'}).join('')+'</select></td><td><select class="form-select" style="padding:3px 6px;font-size:10px" onchange="savePKEv(\''+ds+'\',\'sore\',this.value)"><option value="">--</option>'+areas.map(function(a){return'<option value="'+a.id+'"'+(sr&&sr.areaId===a.id?' selected':'')+'>'+a.name+'</option>'}).join('')+'</select></td></tr>';}h+='</tbody></table></div></div>';document.getElementById('content').innerHTML=h;}

function savePen(){var cls=DB.get('checklists').filter(function(c){return c.areaId===_ipA});var items=[];var cells=document.querySelectorAll('.chk-cell');var idx=0;cls.forEach(function(c){var picOk=cells[idx].querySelector('.sel-ok')?true:false;idx++;var spvOk=cells[idx].querySelector('.sel-ok')?true:false;idx++;var pwEl=cells[idx].querySelector('.sel-ok,.sel-tidak,.sel-skip');var pwSt=pwEl?(pwEl.classList.contains('sel-ok')?'ok':pwEl.classList.contains('sel-tidak')?'tidak':'skip'):'skip';idx++;items.push({clId:c.id,picOk:picOk,spvOk:spvOk,pwSt:pwSt});});var list=DB.get('penilaian').filter(function(p){return !(p.areaId===_ipA&&p.date===_ipD&&p.shift===_ipS)});list.push({id:DB.uid(),areaId:_ipA,date:_ipD,shift:_ipS,items:items,submittedBy:CU.id,ts:Date.now()});DB.set('penilaian',list);toast('Penilaian tersimpan');logAct('Input penilaian '+_ipD+' shift '+_ipS);}

function pgInputIni(){var areas=DB.get('areas');if(CU.role==='spv'||CU.role==='pelaksana'){if(CU.areas && CU.areas.length > 0) { areas = areas.filter(function(a){ return CU.areas.indexOf(a.id) !== -1; }); } else { areas = []; }} var list=DB.get('inisiatif').filter(function(i){return i.date.substring(0,7)===mPrefix(new Date().getFullYear(),new Date().getMonth())}); var h='<div class="card"><div class="card-header"><div class="card-title">Laporan Inisiatif 5R</div><button class="btn btn-primary" onclick="modalIni()"><i class="fas fa-plus"></i>Tambah</button></div>'; if(list.length===0){h+='<div class="empty-state"><i class="fas fa-lightbulb"></i><p>Belum ada laporan.</p></div>';}else{h+='<table><thead><tr><th>Tgl</th><th>Area</th><th>Keterangan</th><th>Pelapor</th></tr></thead><tbody>';list.forEach(function(i){var a=areas.find(function(x){return x.id===i.areaId});h+='<tr><td>'+fmtD(i.date)+'</td><td>'+(a?a.name:'-')+'</td><td>'+i.desc+'</td><td>'+(i.reporter||'-')+'</td></tr>';});h+='</tbody></table>';} h+='</div>';document.getElementById('content').innerHTML=h;}
function modalIni(){var areas=DB.get('areas');if(CU.role==='spv'||CU.role==='pelaksana'){if(CU.areas && CU.areas.length > 0) { areas = areas.filter(function(a){ return CU.areas.indexOf(a.id) !== -1; }); } else { areas = []; }} var opts=areas.map(function(a){return'<option value="'+a.id+'">'+a.name+'</option>'}).join('');showModal('Tambah Inisiatif','<div class="form-group"><label class="form-label">Area</label><select class="form-select" id="f-ia">'+opts+'</select></div><div class="form-group"><label class="form-label">Keterangan</label><textarea class="form-textarea" id="f-id"></textarea></div>','<button class="btn btn-outline" onclick="hideModal()">Batal</button><button class="btn btn-primary" onclick="saveIni()">Simpan</button>');}
function saveIni(){var d=document.getElementById('f-id').value.trim();if(!d){toast('Keterangan wajib','error');return;}var list=DB.get('inisiatif');list.push({id:DB.uid(),areaId:document.getElementById('f-ia').value,date:todayStr(),desc:d,reporter:CU.name,ts:Date.now()});DB.set('inisiatif',list);hideModal();toast('Ditambahkan');pgInputIni();}

function pgInputMys(){var list=DB.get('mystery').filter(function(i){return i.date.substring(0,7)===mPrefix(new Date().getFullYear(),new Date().getMonth())}); var areas=DB.get('areas');var h='<div class="card"><div class="card-header"><div class="card-title">Mystery Guest</div><button class="btn btn-primary" onclick="modalMys()"><i class="fas fa-plus"></i>Tambah</button></div>';if(list.length===0){h+='<div class="empty-state"><i class="fas fa-user-secret"></i><p>Belum ada temuan.</p></div>';}else{h+='<table><thead><tr><th>Tgl</th><th>Area</th><th>Temuan</th></tr></thead><tbody>';list.forEach(function(m){var a=areas.find(function(x){return x.id===m.areaId});h+='<tr><td>'+fmtD(m.date)+'</td><td>'+(a?a.name:'-')+'</td><td>'+m.desc+'</td></tr>';});h+='</tbody></table>';}h+='</div>';document.getElementById('content').innerHTML=h;}
function modalMys(){var opts=DB.get('areas').map(function(a){return'<option value="'+a.id+'">'+a.name+'</option>'}).join('');showModal('Tambah Temuan','<div class="form-group"><label class="form-label">Area</label><select class="form-select" id="f-ma">'+opts+'</select></div><div class="form-group"><label class="form-label">Temuan</label><textarea class="form-textarea" id="f-md"></textarea></div>','<button class="btn btn-outline" onclick="hideModal()">Batal</button><button class="btn btn-primary" onclick="saveMys()">Simpan</button>');}
function saveMys(){var d=document.getElementById('f-md').value.trim();if(!d){toast('Temuan wajib','error');return;}var list=DB.get('mystery');list.push({id:DB.uid(),areaId:document.getElementById('f-ma').value,date:todayStr(),desc:d,ts:Date.now()});DB.set('mystery',list);hideModal();toast('Ditambahkan');pgInputMys();}

function pgInputPK(){var td=todayStr();var duties=DB.get('piket_kantin').filter(function(p){return p.date===td});var areas=DB.get('areas');var h='<div class="card"><div class="card-header"><div class="card-title">Piket Kantin Hari Ini ('+fmtD(td)+')</div></div>';var shifts=['pagi','sore'];shifts.forEach(function(shift){var duty=duties.find(function(d){return d.shift===shift});var a=duty?areas.find(function(x){return x.id===duty.areaId}):null;h+='<div style="margin-bottom:12px;padding:10px;border:1px solid var(--border);border-radius:8px"><div style="font-weight:700;font-size:12px;margin-bottom:6px;text-transform:capitalize">Shift '+shift+'</div>';if(a){h+='<div style="display:flex;align-items:center;gap:10px"><span style="font-size:12px">Area: <strong>'+a.name+'</strong></span>';var res=DB.get('pk_result').find(function(r){return r.date===td&&r.shift===shift});if(res&&res.verified){h+=res.clean?'<span class="badge badge-ok">Bersih</span>':'<span class="badge badge-tidak">Kotor</span>';}else if(res){h+='<span class="badge badge-skip">Menunggu Verifikasi</span>';}else{h+='<button class="btn btn-sm btn-primary" onclick="inputPKRes(\''+shift+'\')">Isi Hasil</button>';}h+='</div>';}else{h+='<span style="font-size:11px;color:var(--text-muted)">Tidak ada jadwal piket untuk shift ini.</span>';}h+='</div>';});h+='</div>';document.getElementById('content').innerHTML=h;}
function inputPKRes(shift){var td=todayStr();showModal('Hasil Piket '+shift,'<div class="form-group"><label class="form-label">Kondisi Kantin</label><select class="form-select" id="f-pkc"><option value="1">Bersih</option><option value="0">Kotor</option></select></div>','<button class="btn btn-outline" onclick="hideModal()">Batal</button><button class="btn btn-primary" onclick="savePKRes(\''+shift+'\')">Simpan</button>');}
function savePKRes(shift){var td=todayStr();var list=DB.get('pk_result').filter(function(r){return!(r.date===td&&r.shift===shift)});list.push({id:DB.uid(),date:td,shift:shift,clean:document.getElementById('f-pkc').value==='1',verified:false,ts:Date.now()});DB.set('pk_result',list);hideModal();toast('Tersimpan');pgInputPK();}

var _rbY,_rbM;
function pgRekap(){var now=new Date();if(_rbY===undefined){_rbY=now.getFullYear();_rbM=now.getMonth();}var areas=DB.get('areas');var h='<div class="card"><div class="card-header"><div class="card-title">Rekap Bulanan</div><div style="display:flex;gap:5px;align-items:center"><button class="btn btn-outline btn-sm" onclick="_rbM=(_rbM+11)%12;_rbY=_rbM===11?_rbY-1:_rbY;pgRekap()"><i class="fas fa-chevron-left"></i></button><span style="font-weight:600;font-size:11px;min-width:110px;text-align:center">'+BULAN[_rbM]+' '+_rbY+'</span><button class="btn btn-outline btn-sm" onclick="_rbM=(_rbM+1)%12;_rbY=_rbM===0?_rbY+1:_rbY;pgRekap()"><i class="fas fa-chevron-right"></i></button></div></div>';if(areas.length===0){h+='<div class="empty-state"><p>Belum ada area.</p></div>';}else{h+='<table><thead><tr><th>No</th><th>Area</th><th>Tipe</th><th>Skor Dasar</th><th>Inisiatif</th><th>Mystery</th><th>Kantin</th><th>Skor Akhir</th></tr></thead><tbody>';var scores=[];areas.forEach(function(a){var s=calcScore(a.id,_rbY,_rbM);if(s){scores.push(s);var bg=s.area.type==='lomba'?'':'style="background:#fffbeb"';h+='<tr '+bg+'><td>'+(scores.length)+'</td><td style="font-weight:600">'+s.area.name+'</td><td><span class="badge '+(s.area.type==='lomba'?'badge-lomba':'badge-nonlomba')+'">'+(s.area.type==='lomba'?'Lomba':'Non-Lomba')+'</span></td><td>'+s.base+'</td><td style="color:var(--primary)">+'+s.initB+'</td><td style="color:var(--danger)">-'+s.mysP+'</td><td style="color:'+(s.kantB-s.kantP>=0?'var(--primary)':'var(--danger)')+'">'+((s.kantB-s.kantP>=0?'+':'')+(s.kantB-s.kantP))+'</td><td style="font-weight:800;font-size:14px">'+s.final+'</td></tr>';}});h+='</tbody></table>';}h+='</div>';document.getElementById('content').innerHTML=h;}

var _klY,_klM;
function pgKlasemen(){var now=new Date();if(_klY===undefined){_klY=now.getFullYear();_klM=now.getMonth();}var areas=DB.get('areas').filter(function(a){return a.type==='lomba'});var scores=[];areas.forEach(function(a){var s=calcScore(a.id,_klY,_klM);if(s)scores.push(s);});scores.sort(function(a,b){return b.final-a.final});var h='<div class="card"><div class="card-header"><div class="card-title">Klasemen Lomba 5R</div><div style="display:flex;gap:5px;align-items:center"><button class="btn btn-outline btn-sm" onclick="_klM=(_klM+11)%12;_klY=_klM===11?_klY-1:_klY;pgKlasemen()"><i class="fas fa-chevron-left"></i></button><span style="font-weight:600;font-size:11px;min-width:110px;text-align:center">'+BULAN[_klM]+' '+_klY+'</span><button class="btn btn-outline btn-sm" onclick="_klM=(_klM+1)%12;_klY=_klM===0?_klY+1:_klY;pgKlasemen()"><i class="fas fa-chevron-right"></i></button></div></div>';if(scores.length<3){h+='<div class="empty-state"><i class="fas fa-trophy"></i><p>Minimal 3 area lomba dengan data penilaian untuk menampilkan podium.</p></div>';}else{h+='<div class="podium">';for(var i=0;i<3;i++){h+='<div class="podium-item podium-'+(i+1)+'"><div class="podium-bar">'+(i+1)+'</div><div class="podium-label">'+scores[i].area.name+'<br><small>('+scores[i].final+')</small></div></div>';}h+='</div>';}h+='<table style="margin-top:15px"><thead><tr><th>Peringkat</th><th>Area</th><th>Skor Akhir</th></tr></thead><tbody>';scores.forEach(function(s,i){h+='<tr><td style="font-weight:800">'+(i+1)+'</td><td style="font-weight:600">'+s.area.name+'</td><td style="font-weight:800;color:var(--primary)">'+s.final+'</td></tr>';});h+='</tbody></table></div>';document.getElementById('content').innerHTML=h;}

document.getElementById('top-date').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
var s=getSession();if(s){CU=s;document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='flex';buildMenu();buildSidebarUser();nav('dashboard');}
</script>
